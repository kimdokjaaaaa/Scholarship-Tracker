<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#c9a227" opacity="0.15"/>
  
  <!-- Graduation cap -->
  <g transform="translate(60, 35)">
    <!-- Cap base -->
    <ellipse cx="0" cy="0" rx="28" ry="6" fill="#0d1b2a"/>
    <!-- Cap square top -->
    <rect x="-24" y="-16" width="48" height="14" rx="2" fill="#0d1b2a"/>
    <!-- Tassel -->
    <line x1="0" y1="-2" x2="0" y2="20" stroke="#c9a227" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="3" fill="#c9a227"/>
  </g>
  
  <!-- Book/Document -->
  <g transform="translate(60, 60)">
    <!-- Left page -->
    <rect x="-16" y="-12" width="13" height="24" rx="1" fill="#1b2d42" stroke="#c9a227" stroke-width="1.5"/>
    <!-- Right page -->
    <rect x="3" y="-12" width="13" height="24" rx="1" fill="#253d57" stroke="#c9a227" stroke-width="1.5"/>
    <!-- Spine -->
    <line x1="-3" y1="-12" x2="-3" y2="12" stroke="#c9a227" stroke-width="2"/>
    
    <!-- Lines on pages (representing text) -->
    <line x1="-13" y1="-6" x2="-6" y2="-6" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    <line x1="-13" y1="-2" x2="-6" y2="-2" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    <line x1="-13" y1="2" x2="-6" y2="2" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    
    <line x1="6" y1="-6" x2="13" y2="-6" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="-2" x2="13" y2="-2" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="2" x2="13" y2="2" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Star accent for excellence -->
  <g transform="translate(85, 25)">
    <polygon points="0,-8 2.4,-2.4 8,-1 2.4,2.4 4,8 0,4 -4,8 -2.4,2.4 -8,-1 -2.4,-2.4" fill="#c9a227"/>
  </g>
</svg>
